version: 2

before:
  hooks:
    - sh scripts/release-licenses.sh

builds:
  - main: ./cmd/t3fleet
    binary: t3fleet
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - THIRD_PARTY_LICENSES.txt
      - examples/config.json
      - examples/boat.json

checksum:
  name_template: checksums.txt

changelog:
  abbrev: 7
  format: '{{ .Message }} ({{ .SHA }})'
  groups:
    - title: Breaking changes
      regexp: '^[a-z]+(\([^)]*\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 10
    - title: Dependencies
      regexp: '^(build|chore|fix)\(deps(-dev)?\):'
      order: 20
    - title: Fixes and performance
      regexp: '^(fix|perf)(\([^)]*\))?:'
      order: 30
    - title: Documentation
      regexp: '^docs(\([^)]*\))?:'
      order: 40
    - title: Build and CI
      regexp: '^(build|ci)(\([^)]*\))?:'
      order: 50
    - title: Other changes
      order: 999

release:
  prerelease: auto
