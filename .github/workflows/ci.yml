name: CI

on:
  push:
      branches:
        - main
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Read pinned linter version
        id: linter
        run: echo "version=$(make -s lint-version)" >> "$GITHUB_OUTPUT"
      - name: Cache linter binary
        id: lint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lint-bin/golangci-lint
          key: golangci-lint-bin-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ steps.linter.outputs.version }}
      - name: Build pinned linter
        if: steps.lint-cache.outputs.cache-hit != 'true'
        # Keep the linter's build inputs out of the shared application cache.
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOBIN: ${{ runner.temp }}/lint-bin
          GOMODCACHE: ${{ runner.temp }}/lint-modules
          GOCACHE: ${{ runner.temp }}/lint-build
        run: make install-lint
      - name: Lint
        run: make lint GOLANGCI_LINT="$RUNNER_TEMP/lint-bin/golangci-lint"

  runtime:
    name: Nix runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - name: Verify runtime initialization and credential isolation
        run: nix build .#checks.x86_64-linux.runtime --no-link

  nix-cli:
    name: Nix CLI and service / ${{ matrix.system }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - name: Build and run the packaged CLI
        run: nix run .#packages.${{ matrix.system }}.t3fleet -- version
      - name: Build the Home Manager service definition
        run: nix build --no-link --impure --expr '(import ./nix/tests/home-manager.nix {}).service'
      - name: Start the configured T3 fleet without cloud access
        shell: bash
        run: |
          # Both instances point to closed loopback endpoints and have no credentials.
          export FLEET_TEST_HOME
          FLEET_TEST_HOME=$(mktemp -d)
          config=$(nix build --no-link --print-out-paths --impure --expr \
            '(import ./nix/tests/home-manager.nix { homeDirectory = builtins.getEnv "FLEET_TEST_HOME"; }).configFile')
          fleet=$(nix build --no-link --print-out-paths .#t3fleet)/bin/t3fleet
          "$fleet" serve --config "$config" > "$FLEET_TEST_HOME/serve.log" 2>&1 &
          daemon=$!
          trap 'kill "$daemon" 2>/dev/null || true; wait "$daemon" || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent --max-time 1 --output /dev/null http://127.0.0.1:47730/_healthcheck; then break; fi
            if ! kill -0 "$daemon" 2>/dev/null; then cat "$FLEET_TEST_HOME/serve.log"; exit 1; fi
            sleep 1
          done
          "$fleet" pair --json --config "$config" | jq -e '.link | startswith("t3code://")' >/dev/null
          "$fleet" list --json --config "$config" | jq -e '. == []' >/dev/null
      - name: Evaluate the macOS Home Manager services
        if: matrix.system == 'x86_64-linux'
        run: |
          nix eval --impure --json --expr '
            let evaluate = system: (import ./nix/tests/home-manager.nix { inherit system; }).service.drvPath;
            in { arm64 = evaluate "aarch64-darwin"; intel = evaluate "x86_64-darwin"; }
          '
